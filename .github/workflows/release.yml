# Publishes a GitHub release (tag vX.Y.Z + wintracker-wp.zip) whenever the version in wintracker.php changes
# on the default branch. WordPress sites pick it up through includes/class-wintracker-updater.php.
#
# To ship an update: bump "Version:" and WINTRACKER_VERSION in wintracker.php, merge to the default branch.
name: Release

on:
  push:
    paths:
      - wintracker.php
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: version
        run: |
          header=$(sed -nE 's/^ \* Version:[[:space:]]+([0-9][0-9A-Za-z.+-]*).*$/\1/p' wintracker.php)
          constant=$(sed -nE "s/^define\( 'WINTRACKER_VERSION', '([^']+)' \);/\1/p" wintracker.php)
          if [ -z "$header" ] || [ "$header" != "$constant" ]; then
            echo "::error file=wintracker.php::Version header ($header) and WINTRACKER_VERSION ($constant) must match."
            exit 1
          fi
          echo "version=$header" >> "$GITHUB_OUTPUT"

      - name: Skip if already released
        id: exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "v${{ steps.version.outputs.version }}" >/dev/null 2>&1; then
            echo "v${{ steps.version.outputs.version }} is already released."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Lint PHP
        if: steps.exists.outputs.skip != 'true'
        run: find . -name '*.php' -not -path './.git/*' -print0 | xargs -0 -n1 php -l

      - name: Check translation template
        if: steps.exists.outputs.skip != 'true'
        run: php bin/make-pot.php --check

      - name: Build zip
        if: steps.exists.outputs.skip != 'true'
        run: git archive --format=zip --prefix=wintracker-wp/ -o wintracker-wp.zip HEAD

      - name: Create release
        if: steps.exists.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ steps.version.outputs.version }}" wintracker-wp.zip \
            --target "${{ github.sha }}" \
            --title "Wintracker ${{ steps.version.outputs.version }}" \
            --generate-notes
